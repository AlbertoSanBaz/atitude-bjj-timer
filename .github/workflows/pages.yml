# Publica la PWA (carpeta web/) en GitHub Pages.
# Se ejecuta al subir cambios de web/ a main, o a mano desde la pestaña Actions.
# Recuerda: al cambiar algo en web/, sube CACHE_VERSION en web/sw.js.
name: Publicar PWA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un solo despliegue a la vez; no se cancela uno que ya esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
